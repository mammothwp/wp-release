# CI for mammothwp/wp-release itself. No release jobs here: the package is consumed from Packagist (tagged vX.Y.Z releases).
default:
  tags: [docker]
  image: composer:2
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

.install: &install
  - composer install --no-interaction --no-progress --prefer-dist

phpcs:
  stage: lint
  before_script: *install
  script:
    - vendor/bin/phpcs

phpstan:
  stage: lint
  before_script: *install
  script:
    - vendor/bin/phpstan analyse --memory-limit=512M --no-progress

phpunit:
  stage: test
  before_script: *install
  script:
    - vendor/bin/phpunit --testsuite unit

# Runs build + check for real against the fixture plugins: needs wp-cli, rsync, zip, unzip, curl,
# network access and PHP pdo_sqlite. Skips are failures here so a broken image cannot go green silently.
# composer:2 is Alpine based, so the missing tools and PHP extensions are installed first.
integration:
  stage: test
  before_script:
    - apk add --no-cache rsync zip unzip curl bash
    - |
      # Only install extensions the image does not already ship (the php image now bundles pdo_sqlite/sqlite3).
      missing=""
      for ext in pdo_sqlite sqlite3 mysqli zip gd intl; do
        php -m | grep -qix "$ext" || missing="$missing $ext"
      done
      if [ -n "$missing" ]; then
        if command -v install-php-extensions >/dev/null; then
          install-php-extensions $missing
        else
          apk add --no-cache $PHPIZE_DEPS sqlite-dev libzip-dev icu-dev libpng-dev
          docker-php-ext-install $missing
        fi
      fi
    - *install
    - command -v wp >/dev/null || { curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x /usr/local/bin/wp; }
  script:
    - vendor/bin/phpunit --testsuite integration --fail-on-skipped
